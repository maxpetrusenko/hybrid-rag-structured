<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid RAG retrieval pipeline and benchmark</title>
  <desc id="desc">Diagram showing dense pgvector retrieval, sparse BM25 retrieval, score fusion, and evaluation metrics where hybrid retrieval leads dense and sparse baselines.</desc>
  <rect width="1200" height="630" fill="#f7f4ec"/>
  <rect x="38" y="36" width="1124" height="558" rx="28" fill="#fffdf8" stroke="#25312b" stroke-width="3"/>
  <text x="72" y="92" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2b24">Hybrid RAG with evaluated retrieval</text>
  <text x="72" y="125" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="16" fill="#566157">Dense vectors + BM25 lexical search + weighted fusion + Recall@K / MRR / nDCG</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#25312b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#25312b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g font-family="Avenir Next, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <rect x="76" y="180" width="170" height="86" rx="14" fill="#e8f0de" stroke="#25312b" stroke-width="2"/>
    <text x="161" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2b24">Documents</text>
    <text x="161" y="241" text-anchor="middle" font-size="13" fill="#536152">md / txt / rst</text>

    <rect x="310" y="154" width="196" height="86" rx="14" fill="#dfeef1" stroke="#25312b" stroke-width="2"/>
    <text x="408" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2b24">Dense path</text>
    <text x="408" y="213" text-anchor="middle" font-size="13" fill="#536152">OpenAI embeddings</text>

    <rect x="310" y="275" width="196" height="86" rx="14" fill="#f4e6cf" stroke="#25312b" stroke-width="2"/>
    <text x="408" y="309" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2b24">Sparse path</text>
    <text x="408" y="334" text-anchor="middle" font-size="13" fill="#536152">Tantivy BM25</text>

    <rect x="572" y="154" width="190" height="86" rx="14" fill="#e9e3f0" stroke="#25312b" stroke-width="2"/>
    <text x="667" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2b24">pgvector</text>
    <text x="667" y="213" text-anchor="middle" font-size="13" fill="#536152">cosine similarity</text>

    <rect x="572" y="275" width="190" height="86" rx="14" fill="#f7ddcf" stroke="#25312b" stroke-width="2"/>
    <text x="667" y="309" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2b24">BM25 index</text>
    <text x="667" y="334" text-anchor="middle" font-size="13" fill="#536152">lexical ranking</text>

    <rect x="828" y="215" width="206" height="94" rx="14" fill="#25312b" stroke="#25312b" stroke-width="2"/>
    <text x="931" y="250" text-anchor="middle" font-size="19" font-weight="700" fill="#fffdf8">Weighted fusion</text>
    <text x="931" y="276" text-anchor="middle" font-size="13" fill="#d8e2d1">normalize, combine, rank</text>
  </g>

  <g stroke="#25312b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M246 223 C274 223, 280 197, 310 197"/>
    <path d="M246 223 C274 223, 280 318, 310 318"/>
    <path d="M506 197 L572 197"/>
    <path d="M506 318 L572 318"/>
    <path d="M762 197 C805 197, 805 244, 828 244"/>
    <path d="M762 318 C805 318, 805 280, 828 280"/>
  </g>

  <g font-family="Avenir Next, Helvetica, Arial, sans-serif">
    <text x="76" y="430" font-size="18" font-weight="700" fill="#1f2b24">Reference benchmark snapshot</text>
    <rect x="76" y="456" width="318" height="48" rx="10" fill="#e8f0de" stroke="#25312b" stroke-width="2"/>
    <text x="100" y="486" font-size="16" fill="#1f2b24">Dense</text>
    <text x="326" y="486" text-anchor="end" font-size="17" font-weight="700" fill="#1f2b24">MRR 0.683</text>

    <rect x="438" y="456" width="318" height="48" rx="10" fill="#f4e6cf" stroke="#25312b" stroke-width="2"/>
    <text x="462" y="486" font-size="16" fill="#1f2b24">Sparse BM25</text>
    <text x="688" y="486" text-anchor="end" font-size="17" font-weight="700" fill="#1f2b24">MRR 0.743</text>

    <rect x="800" y="448" width="318" height="64" rx="12" fill="#25312b" stroke="#25312b" stroke-width="2"/>
    <text x="824" y="486" font-size="18" font-weight="700" fill="#fffdf8">Hybrid</text>
    <text x="1050" y="486" text-anchor="end" font-size="20" font-weight="800" fill="#fffdf8">MRR 0.833</text>

    <text x="76" y="548" font-size="14" fill="#566157">Hybrid snapshot: Recall@1 0.800, Recall@5 0.950, Recall@10 1.000, nDCG@10 0.912</text>
  </g>
</svg>
